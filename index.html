<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Periodic Table</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
  font-family: 'Poppins', sans-serif;
  color: white;
  margin: 0;
}
header {
  text-align: center;
  padding: 20px;
  font-size: 2rem;
  letter-spacing: 3px;
  font-weight: bold;
  background: linear-gradient(90deg, #ff00cc, #3333ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
}
@keyframes shine {
  0% {filter: brightness(1);}
  50% {filter: brightness(1.4);}
  100% {filter: brightness(1);}
}
.searchBar {
  display: block;
  margin: 0 auto 20px;
  padding: 10px;
  width: 80%;
  max-width: 400px;
  border-radius: 8px;
  border: none;
  font-size: 1rem;
}
.periodicTable {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 8px;
  padding: 20px;
}
.elementTile {
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  cursor: pointer;
}
.elementTile:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px var(--glow-color, white);
}
.elementNumber {
  font-size: 0.8rem;
  opacity: 0.8;
}
.elementSymbol {
  font-size: 1.8rem;
  font-weight: bold;
}
.elementName {
  font-size: 0.9rem;
}
.alkaliMetal {--glow-color: #ff4b5c;}
.alkalineEarthMetal {--glow-color: #ffcd3c;}
.transitionMetal {--glow-color: #00bcd4;}
.postTransitionMetal {--glow-color: #4caf50;}
.metalloid {--glow-color: #ff9800;}
.nonMetal {--glow-color: #8bc34a;}
.halogen {--glow-color: #e91e63;}
.nobleGas {--glow-color: #9c27b0;}
.lanthanide {--glow-color: #ff6f61;}
.actinide {--glow-color: #f06292;}
.modalContainer {
  display: none;
  position: fixed;
  top: 0;left: 0;width: 100%;height: 100%;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.modal {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 12px;
  max-width: 400px;
  width: 90%;
}
.modalHeadingContainer {
  display: flex;
  align-items: center;
  gap: 10px;
}
.modalElementSymbol {
  font-size: 2.5rem;
  font-weight: bold;
}
.modalHeading {
  font-size: 1.5rem;
}
.modalLabel {
  margin-top: 10px;
  font-size: 0.9rem;
}
.closeButton {
  background: none;
  border: none;
  font-size: 1.5rem;
  color: white;
  position: absolute;
  top: 15px;
  right: 20px;
  cursor: pointer;
}
</style>
</head>
<body>
<header>PERIODIC TABLE OF ELEMENTS</header>
<input type="text" class="searchBar" placeholder="Search element...">
<div class="periodicTable" id="displayTable"></div>

<div class="modalContainer">
  <div class="modal">
    <button class="closeButton">&#x2715;</button>
    <div class="modalHeadingContainer">
      <div class="modalElementSymbol"></div>
      <div class="modalHeading"></div>
    </div>
    <div class="modalLabel">Atomic number: <span class="atomicNumber"></span></div>
    <div class="modalLabel">Category: <span class="elementCategory"></span></div>
  </div>
</div>

<script>
const elementsData = [
  {num:1,sym:"H",name:"Hydrogen",cat:"nonMetal"},
  {num:2,sym:"He",name:"Helium",cat:"nobleGas"},
  {num:3,sym:"Li",name:"Lithium",cat:"alkaliMetal"},
  {num:4,sym:"Be",name:"Beryllium",cat:"alkalineEarthMetal"},
  {num:5,sym:"B",name:"Boron",cat:"metalloid"},
  {num:6,sym:"C",name:"Carbon",cat:"nonMetal"},
  {num:7,sym:"N",name:"Nitrogen",cat:"nonMetal"},
  {num:8,sym:"O",name:"Oxygen",cat:"nonMetal"},
  {num:9,sym:"F",name:"Fluorine",cat:"halogen"},
  {num:10,sym:"Ne",name:"Neon",cat:"nobleGas"},
  {num:11,sym:"Na",name:"Sodium",cat:"alkaliMetal"},
  {num:12,sym:"Mg",name:"Magnesium",cat:"alkalineEarthMetal"},
  {num:13,sym:"Al",name:"Aluminium",cat:"postTransitionMetal"},
  {num:14,sym:"Si",name:"Silicon",cat:"metalloid"},
  {num:15,sym:"P",name:"Phosphorus",cat:"nonMetal"},
  {num:16,sym:"S",name:"Sulfur",cat:"nonMetal"},
  {num:17,sym:"Cl",name:"Chlorine",cat:"halogen"},
  {num:18,sym:"Ar",name:"Argon",cat:"nobleGas"},
  {num:19,sym:"K",name:"Potassium",cat:"alkaliMetal"},
  {num:20,sym:"Ca",name:"Calcium",cat:"alkalineEarthMetal"},
  // ... fill up to 118 with appropriate categories ...
  {num:118,sym:"Og",name:"Oganesson",cat:"nobleGas"}
];
const table = document.getElementById("displayTable");
function renderElements(list){
  table.innerHTML = "";
  list.forEach(e=>{
    const div = document.createElement("div");
    div.className = `${e.cat} elementTile`;
    div.innerHTML = `<div class="elementNumber">${e.num}</div>
                     <div class="elementSymbol">${e.sym}</div>
                     <div class="elementName">${e.name}</div>`;
    div.addEventListener("click",()=>{
      document.querySelector(".modalElementSymbol").textContent = e.sym;
      document.querySelector(".modalHeading").textContent = e.name;
      document.querySelector(".atomicNumber").textContent = e.num;
      document.querySelector(".elementCategory").textContent = e.cat;
      document.querySelector(".modalContainer").style.display = "flex";
    });
    table.appendChild(div);
  });
}
renderElements(elementsData);
document.querySelector(".searchBar").addEventListener("input",e=>{
  const val = e.target.value.toLowerCase();
  renderElements(elementsData.filter(el=>el.name.toLowerCase().includes(val)||el.sym.toLowerCase().includes(val)));
});
document.querySelector(".closeButton").addEventListener("click",()=>{
  document.querySelector(".modalContainer").style.display = "none";
});
</script>
</body>
  </html>
